data:
  # Binary target: did the student pass the final exam (Final_Exam_Score >= 0.5)?
  target_variable: "passed"
  data_folder: "data"
  batch_size: 4
  test_size: 0.2
  val_size: 0.1
  random_state: 42

  # Which feature set every model trains on:
  #   "all"      -> every column except the leakage/identifier columns
  #   "selected" -> only the columns listed in `selected_features` below
  # (see notebooks/02_feature_selection.ipynb for how this list was derived)
  feature_set: "selected"
  selected_features:
    - 'statistics_Attempts'
    - 'statistics_Score/10.00_mean'
    - 'statistics_Score/10.00_max'
    - 'statistics_Score/10.00_min'
    - 'statistics_Duration_minutes_sum'
    - 'statistics_Duration_minutes_mean'
    - 'predictive_analytics_Attempts'
    - 'predictive_analytics_Score/10.00_mean'
    - 'predictive_analytics_Score/10.00_max'
    - 'predictive_analytics_Score/10.00_min'
    - 'predictive_analytics_Duration_minutes_sum'
    - 'predictive_analytics_Duration_minutes_mean'
    - 'evaluation_Attempts'
    - 'evaluation_Score/10.00_mean'
    - 'evaluation_Score/10.00_max'
    - 'evaluation_Score/10.00_min'
    - 'evaluation_Duration_minutes_sum'
    - 'evaluation_Duration_minutes_mean'
    - 'mdm_Attempts'
    - 'mdm_Score/10.00_mean'
    - 'mdm_Score/10.00_max'
    - 'mdm_Score/10.00_min'
    - 'mdm_Duration_minutes_sum'
    - 'mdm_Duration_minutes_mean'
    - 'regression_Attempts'
    - 'regression_Score/10.00_mean'
    - 'regression_Score/10.00_max'
    - 'regression_Score/10.00_min'
    - 'regression_Duration_minutes_sum'
    - 'regression_Duration_minutes_mean'

models:
  logreg:
    max_iter: 10000
    C: 1.0
    class_weight: null

  xgboost:
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.1
    subsample: 1.0
    eval_metric: "logloss"

  mlp:
    hidden_dims: [128, 64]
    dropout: 0.2
    learning_rate: 0.0001

trainer:
  max_epochs: 50

logging:
  project: "quiz_prediction"
  # Names of the three wandb runs (one per model).
  run_names:
    logreg: "LogisticRegression_feature_selection_30"
    xgboost: "XGBoost_feature_selection_30"
    mlp: "MLP_feature_selection_30"
