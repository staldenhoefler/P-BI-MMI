data:
  # Binary target: did the student pass the final exam (Final_Exam_Score >= 0.5)?
  target_variable: "passed"
  data_folder: "data"
  batch_size: 4
  test_size: 0.2
  val_size: 0.1
  random_state: 42

  # Which feature set every model trains on:
  #   "all"      -> every column except the leakage/identifier columns
  #   "selected" -> only the columns listed in `selected_features` below
  # (see notebooks/02_feature_selection.ipynb for how this list was derived)
  feature_set: "selected"
  # Trimmed to a compact, interpretable shortlist (~4 features) because the
  # dataset is tiny (~135 students, ~27 in test) and p >> n overfits badly.
  # One mean quiz score per topic — the strongest, least-collinear signals from
  # notebooks/02_feature_selection.ipynb.
  selected_features:
  - statistics_Attempts
  - mdm_Attempts
  - mdm_Score/10.00_mean
  - evaluation_Duration_minutes_sum
  - statistics_Duration_minutes_sum
  - statistics_Score/10.00_mean
  - predictive_analytics_Score/10.00_min
  - regression_Duration_minutes_mean
  - predictive_analytics_Attempts
  - mdm_Duration_minutes_sum

models:
  logreg:
    max_iter: 10000
    # L1 + liblinear gives a sparse, regularised fit on the tiny imbalanced set;
    # class_weight rebalances the ~2:1 pass/fail ratio.
    penalty: l1
    solver: liblinear
    C: 0.5
    class_weight: balanced

  xgboost:
    # Shallow, few trees to avoid overfitting ~108 training rows. scale_pos_weight
    # is derived from the training labels at build time (see build_xgboost).
    n_estimators: 50
    max_depth: 2
    learning_rate: 0.1
    subsample: 1.0
    eval_metric: "logloss"

  mlp:
    # One small hidden layer; class-weighted loss + early stopping for imbalance.
    hidden_dims: [16]
    dropout: 0.2
    learning_rate: 0.0001
    class_weight: balanced
    early_stopping: true
    patience: 5

trainer:
  max_epochs: 50

# Misclassification costs for the cost-matrix evaluation (see src/metrics.py).
#
# IMPORTANT — class orientation. sklearn orders labels "failed" < "passed", so the
# POSITIVE class is `passed` (label 1). The business goal is an early-warning system
# that flags students who will FAIL, so the expensive mistake is *missing a failing
# student* — i.e. predicting "pass" for someone who actually fails. With positive =
# passed, that error is a FALSE POSITIVE, and a false alarm (predict fail, actually
# passes) is a FALSE NEGATIVE. Hence FP >> FN here:
#   false_positive : missed at-risk student (predict pass, actually failed) -> costly
#   false_negative : false alarm           (predict fail, actually passed)  -> cheap
cost:
  false_positive: 5.0
  false_negative: 1.0

# Stratified cross-validation for the pooled out-of-fold evaluation.
cv:
  n_splits: 5

logging:
  project: "quiz_prediction"
  # Names of the three wandb runs (one per model).
  run_names:
    logreg: "LogisticRegression_fs10_normalised"
    xgboost: "XGBoost_fs10_normalised"
    mlp: "MLP_fs10_normalised"
    dummy_most_frequent: "Dummy_most_frequent"
    dummy_stratified: "Dummy_stratified"
